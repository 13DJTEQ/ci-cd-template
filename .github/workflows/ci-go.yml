# CI caller for Go projects.
name: CI (Go)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  call-ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      stack: go
      go-version: "1.22"
      lint-command: "go vet ./..."
      build-command: "go build ./..."
      test-command: "go test ./..."
