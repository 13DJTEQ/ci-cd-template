# Reusable CI — one source of truth for every project.
# Callers (ci-node.yml, ci-python.yml, ci-go.yml, ci-ios.yml) set the stack + commands.
# The deploy path is separate (deploy-staging.yml); CI never deploys.
name: CI Reusable
on:
  workflow_call:
    inputs:
      stack:
        description: "node | python | go | ios | generic"
        required: true
        type: string
      working-directory:
        description: "Subdirectory holding the project (default repo root)"
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "20"
      python-version:
        required: false
        type: string
        default: "3.12"
      go-version:
        required: false
        type: string
        default: "1.22"
      xcode-version:
        required: false
        type: string
        default: ""
      lint-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  ci:
    # iOS must run on macOS runners; everything else on Linux.
    runs-on: ${{ inputs.stack == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: inputs.stack == 'ios' && inputs.xcode-version != ''
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app

      - name: Node setup
        if: inputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ''  # explicit actions/cache used below instead

      - name: Python setup
        if: inputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: ''  # explicit actions/cache used below instead

      - name: Go setup
        if: inputs.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      # ── Dependency caching via actions/cache ──────────────────────────
      - name: Cache npm dependencies
        if: inputs.stack == 'node'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache pip dependencies
        if: inputs.stack == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Go module cache
        if: inputs.stack == 'go'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        if: inputs.stack == 'go'
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # ── Install ─────────────────────────────────────────────────────────
      - name: Install (node)
        if: inputs.stack == 'node'
        run: npm ci

      - name: Install (python)
        if: inputs.stack == 'python'
        run: pip install -r requirements.txt && pip install pytest build

      - name: Install (go)
        if: inputs.stack == 'go'
        run: go mod download

      - name: Install (ios)
        if: inputs.stack == 'ios'
        run: bundle install || true

      # ── Lint / Build / Test ─────────────────────────────────────────────
      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Upload test results
        if: always() && inputs.test-command != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            .junit/
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore
