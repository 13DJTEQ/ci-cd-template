# Deploy to production — fires on a version tag (v*) like staging,
# BUT is gated by the `prod` environment's required reviewer (manual approval).
# Flow: tag -> staging auto-deploys -> prod waits for human approval.
# Both staging and prod share deploy-reusable.yml; only the environment + gate differ.
name: Deploy to Production
on:
  push:
    tags: [v*"]
concurrency:
  group: deploy-prod
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  call-deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      deploy-command: "./scripts/deploy.sh production ${{ github.ref_name }}"
