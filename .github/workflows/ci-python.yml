# CI caller for Python projects.
name: CI (Python)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Guard: these callers only run in CONSUMER repos (which have a real project).
# The template repo itself has no project, so skip to avoid failing CI noise.
permissions:
  contents: read
  actions: read
jobs:
  ci:
    if: github.repository != '13DJTEQ/ci-cd-template'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    uses: ./.github/workflows/ci-reusable.yml
    with:
      stack: python
      python-version: ${{ matrix.python-version }}
      lint-command: "flake8 ."
      build-command: "python -m build"
      test-command: "pytest"
